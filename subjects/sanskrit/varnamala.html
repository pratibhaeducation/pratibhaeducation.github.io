<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हिंदी वर्णमाला</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
    }

    #protectedContent {
      display: none;
      padding: 25px;
    }

    #loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <!-- जब तक login check नहीं होता -->
  <div id="loading">
    Content सुरक्षित रूप से जाँचा जा रहा है...
  </div>

  <!-- वास्तविक topic -->
  <div id="protectedContent">

    <h1 id="contentTitle"></h1>

    <div id="contentText"></div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==============================
    // अपनी Firebase Config यहाँ रखें
    // ==============================

    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "YOUR_PROJECT.firebaseapp.com",

      projectId: "YOUR_PROJECT_ID",

      storageBucket: "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId: "YOUR_SENDER_ID",

      appId: "YOUR_APP_ID"

    };


    // Firebase शुरू करें
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==============================
    // Login check
    // ==============================

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        // Login है
        console.log("User logged in:", user.email);

        try {

          // Firestore में protectedContent/varnmala
          const docRef = doc(
            db,
            "protectedContent",
            "varnmala"
          );

          const docSnap = await getDoc(docRef);


          if (docSnap.exists()) {

            const data = docSnap.data();

            document.getElementById("contentTitle").textContent =
              data.title || "हिंदी वर्णमाला";

            document.getElementById("contentText").textContent =
              data.content || "";

            document.getElementById("loading").style.display =
              "none";

            document.getElementById("protectedContent").style.display =
              "block";

          } else {

            document.getElementById("loading").textContent =
              "Content नहीं मिला।";

          }

        } catch (error) {

          console.error(error);

          document.getElementById("loading").textContent =
            "Content load नहीं हो पाया।";

        }

      } else {

        // ==============================
        // Login नहीं है
        // ==============================

        window.location.href = "index.html";

      }

    });

  </script>

</body>
</html>
