<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Varnamala - Hindi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fdf6e3] min-h-screen">
  <div class="max-w-[1120px] mx-auto p-3 md:p-6">
    <div class="bg-white rounded-xl p-4 md:p-7 shadow-sm border border-stone-200">
      <h1 class="text-[28px] md:text-[36px] font-extrabold text-center mb-1">हिन्दी वर्णमाला</h1>
      <p class="text-center text-stone-600 mb-6">स्वर और व्यंजन</p>

      <h2 class="font-bold text-[18px] mb-3">स्वर (13)</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">अ</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">आ</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">इ</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">ई</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">उ</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">ऊ</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">ए</div>
        <div class="bg-yellow-50 border border-amber-200 rounded-xl p-4 text-center text-[22px] font-bold">ऐ</div>
      </div>

      <h2 class="font-bold text-[18px] mb-3">व्यंजन</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">क</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">ख</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">ग</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">घ</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">च</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">छ</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">ज</div>
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-[22px] font-bold">झ</div>
      </div>

      <div class="mt-6 text-center">
        <a href="../hindi.html" class="inline-block bg-black text-white px-5 py-2 rounded-full">← Back to Hindi</a>
      </div>
    </div>
  </div>
</body>
</html>
